<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo D — sidebar + content + map</title>
<style>
  :root{--blue:#0072B2;--blue-dk:#00598c;--vermil:#D55E00;--green:#009E73;--ink:#1a1d1f;--muted:#5b636b;--line:#e7eaee;--bg:#eef1f5;--card:#fff;--soft:#f3f6f9;--nav:230px;--info:380px}
  *{box-sizing:border-box;margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif}
  body{height:100vh;overflow:hidden;color:var(--ink);background:var(--bg)}
  .app{display:grid;grid-template-columns:var(--nav) var(--info) 1fr;grid-template-rows:54px 1fr;height:100vh}
  /* top bar */
  .top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
  .top .brand{font-weight:700;font-size:15px}.top .brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.04em;text-transform:uppercase}
  .search{margin-left:20px;flex:1;max-width:440px;position:relative}
  .search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px 9px 34px;background:var(--soft);font-size:14px}
  .search .mg{position:absolute;left:11px;top:9px;color:var(--muted)}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted)}
  .live{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green)}.live .d{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .acct{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
  /* nav sidebar */
  .nav{background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:8px 8px}
  .grp{margin-top:6px}
  .grp>.gh{display:flex;align-items:center;gap:10px;padding:9px 10px;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer;border-radius:8px;text-transform:none}
  .grp>.gh:hover{background:var(--soft)}
  .grp>.gh .ic{font-size:16px;width:20px;text-align:center}
  .grp>.gh .ar{margin-left:auto;color:var(--muted);font-size:11px;transition:.15s}
  .grp.open>.gh .ar{transform:rotate(90deg)}
  .grp .sub{display:none;padding:2px 0 4px 40px}
  .grp.open .sub{display:block}
  .grp .sub a{display:block;padding:7px 10px;border-radius:7px;font-size:13.5px;color:var(--muted);cursor:pointer}
  .grp .sub a:hover{background:var(--soft)}
  .grp .sub a.on{background:#e7f1fb;color:var(--blue-dk);font-weight:600}
  .navdiv{height:1px;background:var(--line);margin:8px 6px}
  .navlink{display:flex;align-items:center;gap:10px;padding:9px 10px;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer;border-radius:8px}
  .navlink:hover{background:var(--soft)}.navlink .ic{font-size:16px;width:20px;text-align:center}
  /* info panel */
  .info{background:var(--bg);border-right:1px solid var(--line);overflow-y:auto;padding:16px 16px}
  .crumb{font-size:12px;color:var(--muted);font-weight:600}
  .title{font-size:18px;font-weight:700;margin:2px 0 2px}
  .titlesub{font-size:13px;color:var(--muted);margin-bottom:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
  .cap{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .status{display:inline-flex;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:#e3f4ee;color:#0a7a5b}
  .big{font-size:38px;font-weight:800;color:var(--blue-dk);margin-top:6px}.big small{font-size:15px;color:var(--muted);font-weight:600}
  .band{position:relative;height:8px;background:#eef3f8;border-radius:6px;margin:24px 4px 30px}
  .band .fill{position:absolute;height:100%;background:var(--blue);opacity:.22;border-radius:6px}
  .band .tk{position:absolute;top:-5px;width:2px;height:18px;background:var(--blue-dk)}.band .tk.r{height:22px;top:-7px;width:3px;background:var(--blue)}
  .band .lb{position:absolute;top:12px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}.band .lb b{color:var(--blue-dk)}
  .word{font-size:22px;font-weight:800;color:var(--blue-dk)}
  .dots{display:inline-flex;gap:4px;margin-left:8px}.dots i{width:18px;height:8px;border-radius:3px;background:#dde5ee}.dots i.on{background:var(--blue)}
  .rr{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}.rr .ck{width:20px;height:20px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px;flex:none}.rr .ck.y{background:var(--blue)}.rr .ck.n{background:var(--vermil)}
  .subtle{color:var(--muted);font-size:13px}
  .mbar{position:relative;height:24px;border-radius:8px;overflow:hidden;background:#eee;margin:12px 0 4px}.mbar .c{position:absolute;left:0;top:0;bottom:0;background:#f6d3c2;display:flex;align-items:center;padding-left:8px;font-size:12px;font-weight:700;color:#9a3d12}.mbar .p{position:absolute;right:0;top:0;bottom:0;background:#cdeede;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:12px;font-weight:700;color:#0a7a5b}
  .frow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--soft);font-size:14px}.frow .dt{color:var(--muted);font-size:11px;width:46px;flex:none}
  .amrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--soft);font-size:14px}.amrow b{color:var(--blue-dk)}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted);text-transform:uppercase;font-size:10px}
  /* chat + history */
  .chatwrap{display:flex;flex-direction:column;height:calc(100vh - 130px)}
  .hist{display:flex;flex-direction:column;gap:4px;margin:8px 0}
  .hist a{font-size:13px;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;background:var(--soft)}
  .hist a:hover{color:var(--ink)}
  .cbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 0}
  .msg{max-width:88%;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.4}.msg.bot{background:var(--card);border:1px solid var(--line)}.msg.me{background:#e7f1fb;color:var(--blue-dk);align-self:flex-end}
  .cin{display:flex;gap:8px;margin-top:8px}.cin input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px}.cin button{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:0 16px;font-weight:700}
  .setrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--soft)}
  .toggle{display:flex;background:var(--soft);border-radius:8px;padding:3px}.toggle button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;color:var(--muted);cursor:pointer}.toggle button.on{background:#fff;color:var(--blue-dk)}
  /* map */
  .map{position:relative;background:#e9ede2;overflow:hidden}
  .map .g{position:absolute;inset:0;background-image:linear-gradient(#0000000a 1px,transparent 1px),linear-gradient(90deg,#0000000a 1px,transparent 1px);background-size:42px 42px}
  .pin{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer}.pin .dot{min-width:34px;height:26px;padding:0 6px;border-radius:14px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 5px #0003}.pin.sel .dot{background:var(--vermil);transform:scale(1.12)}.pin .nm{font-size:11px;font-weight:700;background:#ffffffcc;border-radius:4px;padding:0 5px;margin-top:2px;display:inline-block}
  .map.focused .pin:not(.sel){opacity:.4;transition:.3s}
  .ring{position:absolute;width:190px;height:190px;border-radius:50%;border:2px solid var(--vermil);background:#d55e0016;transform:translate(-50%,-50%);pointer-events:none;transition:.35s;opacity:0}.map.focused .ring{opacity:1}
  .mapcard{position:absolute;left:16px;bottom:16px;width:268px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 6px 18px #0002;display:none}
  .mapcard .nm{font-weight:800;font-size:16px}.mapcard .pr{font-size:26px;font-weight:800;color:var(--blue-dk);margin:2px 0}.mapcard .am{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--muted)}.mapcard .am b{color:var(--ink)}
  .layers{position:absolute;right:12px;top:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}.layers h4{font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.layers label{display:block;padding:2px 0;cursor:pointer}
</style></head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="brand">Jordan Real Estate<small>Intelligence</small></div>
    <div class="search"><span class="mg">🔍</span><input id="search" placeholder="Search an area — e.g. Abdoun, Sweifieh…" value="Abdoun"></div>
    <div class="right"><span class="live"><span class="d"></span>LIVE</span><span>?</span><span>◐</span><span class="acct">M</span></div>
  </div>

  <!-- NAV: categories + subcategories -->
  <nav class="nav" id="nav">
    <div class="grp open" data-g="pricing"><div class="gh" onclick="grp(this)"><span class="ic">🏷️</span>Pricing<span class="ar">▸</span></div>
      <div class="sub"><a class="on" onclick="go('price',this)">Launch price</a><a onclick="go('comps',this)">Comparable sales</a></div></div>
    <div class="grp" data-g="cost"><div class="gh" onclick="grp(this)"><span class="ic">💰</span>Costs &amp; Profit<span class="ar">▸</span></div>
      <div class="sub"><a onclick="go('land',this)">Land value</a><a onclick="go('margin',this)">Profit margin</a><a onclick="go('build',this)">Buildability</a></div></div>
    <div class="grp" data-g="market"><div class="gh" onclick="grp(this)"><span class="ic">📈</span>Market<span class="ar">▸</span></div>
      <div class="sub"><a onclick="go('changed',this)">What changed</a><a onclick="go('comp',this)">Competitors</a></div></div>
    <div class="grp" data-g="loc"><div class="gh" onclick="grp(this)"><span class="ic">🗺️</span>Location<span class="ar">▸</span></div>
      <div class="sub"><a onclick="go('nearby',this)">Nearby amenities</a><a onclick="go('layers',this)">Map layers</a></div></div>
    <div class="navdiv"></div>
    <div class="navlink" onclick="go('chat',this)"><span class="ic">💬</span>Assistant</div>
    <div class="navlink" onclick="go('set',this)"><span class="ic">⚙</span>Settings</div>
  </nav>

  <!-- INFO panel -->
  <section class="info" id="info"></section>

  <!-- MAP always visible -->
  <div class="map">
    <div class="g"></div>
    <div class="ring" id="ring"></div>
    <div class="layers"><h4>Layers</h4><label><input type="checkbox" checked> Schools</label><label><input type="checkbox"> Hospitals</label><label><input type="checkbox" checked> Transport</label></div>
    <div id="pins"></div>
    <div class="mapcard" id="mapcard"></div>
  </div>
</div>

<script>
  var D={Abdoun:{p:918,ms:597,pr:1239,cw:"Good",cn:2,comps:12,land:480,margin:22,t:[905,910,912,908,915,918,916,918],x:62,y:40,s:17,h:1,tr:8},
  Dabouq:{p:950,ms:618,pr:1283,cw:"Good",cn:2,comps:12,land:510,margin:20,t:[930,940,935,945,948,950,949,950],x:30,y:28,s:6,h:0,tr:3},
  Sweifieh:{p:839,ms:545,pr:1133,cw:"Good",cn:2,comps:12,land:410,margin:24,t:[820,825,830,828,835,839,838,839],x:44,y:62,s:11,h:2,tr:6},
  Shmeisani:{p:696,ms:506,pr:885,cw:"Strong",cn:3,comps:16,land:330,margin:26,t:[690,692,695,694,696,695,696,696],x:72,y:66,s:9,h:3,tr:5},
  Khalda:{p:672,ms:482,pr:863,cw:"Good",cn:2,comps:12,land:300,margin:25,t:[665,668,670,669,672,671,672,672],x:20,y:52,s:8,h:1,tr:4}};
  var cur="Abdoun",V="price",AX=[450,1300];
  var TITLES={price:["Pricing","Launch price","What price to sell your units at"],comps:["Pricing","Comparable sales","Recent nearby sales behind the price"],
    land:["Costs & Profit","Land value","Most you can pay for the land"],margin:["Costs & Profit","Profit margin","Your profit if you build and sell"],build:["Costs & Profit","Buildability","Zoning, slope, utilities"],
    changed:["Market","What changed","Recent moves that affect your price"],comp:["Market","Competitors","Nearby projects and their prices"],
    nearby:["Location","Nearby amenities","Schools, hospitals, transport around the area"],layers:["Location","Map layers","Turn things on the map on or off"],
    chat:["Assistant","Assistant","Ask anything — answered from our data & the live market"],set:["Settings","Settings",""]};
  function pct(v){return((v-AX[0])/(AX[1]-AX[0])*100).toFixed(1)}
  function spark(a){var mn=Math.min.apply(0,a),mx=Math.max.apply(0,a);var p=a.map(function(v,i){return(i/(a.length-1)*120).toFixed(1)+","+(34-(v-mn)/(mx-mn||1)*30-2).toFixed(1)}).join(" ");return '<svg style="width:120px;height:34px" viewBox="0 0 120 34" preserveAspectRatio="none"><polyline points="'+p+'" fill="none" stroke="var(--blue)" stroke-width="2"/></svg>'}
  function pins(){document.getElementById('pins').innerHTML=Object.keys(D).map(function(n){var d=D[n];return '<div class="pin '+(n===cur?'sel':'')+'" style="left:'+d.x+'%;top:'+d.y+'%" onclick="setA(\''+n+'\')"><div class="dot">'+d.p+'</div><div class="nm">'+n+'</div></div>'}).join('')}
  function grp(el){el.parentElement.classList.toggle('open')}
  function go(v,el){V=v;document.querySelectorAll('.nav .sub a,.navlink').forEach(function(a){a.classList.remove('on')});if(el)el.classList.add('on');info()}
  function setA(n){cur=n;var d=D[n];document.getElementById('search').value=n;
    document.querySelector('.map').classList.add('focused');
    var r=document.getElementById('ring');r.style.left=d.x+'%';r.style.top=d.y+'%';
    var mc=document.getElementById('mapcard');mc.style.display='block';
    mc.innerHTML='<div class="nm">'+n+'</div><div class="pr">'+d.p+' <span style="font-size:13px;color:var(--muted)">JD/m²</span></div><div class="subtle">Safe '+d.ms+' – Premium '+d.pr+' · '+d.cw+' confidence</div><div class="am"><span>🎓 <b>'+d.s+'</b></span><span>🏥 <b>'+d.h+'</b></span><span>🚌 <b>'+d.tr+'</b></span></div>';
    pins();info()}
  function hd(){var t=TITLES[V];return '<div class="crumb">'+t[0]+'</div><div class="title">'+t[1]+'</div>'+(t[2]?'<div class="titlesub">'+t[2]+'</div>':'')}
  function info(){var d=D[cur],e=document.getElementById('info');var H=hd();
    if(V==='price')e.innerHTML=H+
      '<div class="card"><div class="status">● READY TO LAUNCH</div><div class="cap" style="margin-top:8px">Recommended launch price</div><div class="big">'+d.p.toLocaleString()+' <small>JD/m²</small></div><div class="subtle">↗ Stable · last 90 days '+spark(d.t)+'</div></div>'+
      '<div class="card"><div class="cap">Price range</div><div class="band"><div class="fill" style="left:'+pct(d.ms)+'%;width:'+(pct(d.pr)-pct(d.ms))+'%"></div><div class="tk" style="left:'+pct(d.ms)+'%"></div><div class="tk r" style="left:'+pct(d.p)+'%"></div><div class="tk" style="left:'+pct(d.pr)+'%"></div><div class="lb" style="left:'+pct(d.ms)+'%">Safe <b>'+d.ms+'</b></div><div class="lb" style="left:'+pct(d.p)+'%">Best <b>'+d.p+'</b></div><div class="lb" style="left:'+pct(d.pr)+'%">Premium <b>'+d.pr+'</b></div></div></div>'+
      '<div class="card"><span class="cap">Confidence</span> <span class="word">'+d.cw+'</span><span class="dots">'+[1,2,3].map(function(i){return'<i class="'+(i<=d.cn?'on':'')+'"></i>'}).join('')+'</span><div class="subtle" style="margin-top:6px">'+d.comps+' nearby sales</div></div>';
    else if(V==='comps')e.innerHTML=H+'<div class="card"><table><tr><th>Area</th><th>Size</th><th>Asking</th><th>Adjusted</th></tr><tr><td>Abdoun</td><td>180 m²</td><td>1,139</td><td>1,139</td></tr><tr><td>Abdoun</td><td>172 m²</td><td>1,000</td><td>1,000</td></tr><tr><td>Abdoun</td><td>165 m²</td><td>667</td><td>667</td></tr></table><div class="subtle" style="margin-top:8px">12 comparable sales used · <a href="#">see all</a></div></div>';
    else if(V==='land')e.innerHTML=H+'<div class="card"><div class="cap">Most you can pay for land</div><div class="big">'+d.land+'K <small>JD/dunum</small></div><div class="subtle">Above this, the project stops making a normal profit.</div></div>';
    else if(V==='margin')e.innerHTML=H+'<div class="card"><div class="cap">Profit margin</div><div class="big" style="color:var(--green)">'+d.margin+'%</div><div class="mbar"><div class="c" style="width:'+(100-d.margin)+'%">Costs</div><div class="p" style="width:'+d.margin+'%">Profit</div></div><div class="subtle">Developers usually target 15–25%.</div></div>';
    else if(V==='build')e.innerHTML=H+'<div class="card"><div class="amrow">Zoning &amp; height <span class="subtle">coming soon</span></div><div class="amrow">Slope &amp; flood <span class="subtle">coming soon</span></div><div class="amrow">Utilities <span class="subtle">coming soon</span></div></div>';
    else if(V==='changed')e.innerHTML=H+'<div class="card"><div class="frow"><span class="dt">Oct 24</span><div>Competitor launched 150 units nearby at 780 JD/m². <b>Consider holding.</b></div></div><div class="frow"><span class="dt">Oct 20</span><div>New road approved nearby — usually lifts prices.</div></div><div class="frow"><span class="dt">Oct 15</span><div>Material prices steady.</div></div></div>';
    else if(V==='comp')e.innerHTML=H+'<div class="card"><div class="amrow">Abdoun Terraces <b>1,620</b></div><div class="amrow">The Gate <b>980</b></div><div class="amrow">Skyline Res. <b>1,050</b></div></div>';
    else if(V==='nearby')e.innerHTML=H+'<div class="card"><div class="amrow">🎓 Schools within 1 km <b>'+d.s+'</b></div><div class="amrow">🏥 Hospitals <b>'+d.h+'</b></div><div class="amrow">🚌 Transport stops <b>'+d.tr+'</b></div></div>';
    else if(V==='layers')e.innerHTML=H+'<div class="card subtle">Use the toggles on the map (top-right) to show schools, hospitals, transport and the opportunity heat-map.</div>';
    else if(V==='chat')e.innerHTML=H+
      '<div class="chatwrap"><div class="cap">Recent chats</div><div class="hist"><a>Why is Abdoun 918? · 2h ago</a><a>Khalda vs Sweifieh margin · yesterday</a><a>What changed this week? · Mon</a></div>'+
      '<div class="cbody"><div class="msg bot">Ask anything about a price or area — I explain, never invent, and check the live market.</div><div class="msg me">Buyer says the tower next door sells 1-bed cheaper — why is ours higher?</div><div class="msg bot">Ours is higher floor, open view, better finish. Adjusted for those, the gap is fair.</div></div>'+
      '<div class="cin"><input placeholder="Ask…"><button>Ask</button></div></div>';
    else if(V==='set')e.innerHTML=H+'<div class="setrow"><div><b>Language</b><div class="subtle">Numbers &amp; map stay the same</div></div><div class="toggle"><button>English</button><button class="on">العربية</button></div></div><div class="setrow"><div><b>Weekly email</b></div><div class="toggle"><button class="on">On</button><button>Off</button></div></div>';
  }
  pins();setA('Abdoun');
</script>
</body></html>
